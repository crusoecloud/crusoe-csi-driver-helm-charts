# Default values for crusoe-csi-driver.
csi:
  ssd:
    enabled: true
    driverName: "ssd.csi.crusoe.ai"
  fs:
    enabled: true
    driverName: "fs.csi.crusoe.ai"

crusoe:
  # If not running on a Crusoe Managed Kubernetes cluster, projectID should be set to the Crusoe Cloud project ID
  # for your cluster.
  projectID: ""
  secrets:
    crusoeApiKeys:
      # The Crusoe CSI Driver requires access to the Crusoe API in order to manage and mount Crusoe Storage Disks.
      # It is expected that the secret will contain two keys at accessKeyPath and secretKeyPath containing
      # the base64 encoded access key and secret key respectively.
      secretName: "crusoe-api-keys"
      accessKeyPath: "CRUSOE_CSI_ACCESS_KEY"
      secretKeyPath: "CRUSOE_CSI_SECRET_KEY"
  api:
    # Specify the Crusoe API endpoint to use directly.
    # Alternatively, the driver can read the endpoint from a secret
    #endpoint: "https://api.crusoecloud.com/v1alpha5"
    #fromSecret:
    #  name: "crusoe-api-keys"
    #  endpointKeyPath: "CRUSOE_API_ENDPOINT"

controller:
  # Extra configuration to add under the deployment spec
  customSpec: { }
  nodeSelector: { }
  affinity: { }
  topologySpreadConstraints: [ ]
  tolerations: [ ]
  priorityClassName: "system-cluster-critical"
  crusoeCsiDriver:
    image:
      repository: ghcr.io/crusoecloud/crusoe-csi-driver
      tag: "v0.1.9"
      imagePullSecrets: [ ]
      imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 200Mi
      limits:
        cpu: 100m
        memory: 200Mi
  attacher:
    image:
      repository: registry.k8s.io/sig-storage/csi-attacher
      tag: "v4.7.0"
  provisioner:
    image:
      repository: registry.k8s.io/sig-storage/csi-provisioner
      tag: "v5.1.0"
  resizer:
    image:
      repository: registry.k8s.io/sig-storage/csi-resizer
      tag: "v1.12.0"

node:
  # Extra configuration to add under the daemonset spec
  customSpec: { }
  nodeSelector: { }
  # Note that the node agent uses a DaemonSet
  # Only NodeAffinity affinities will affect the scheduling of the node agent
  # podAffinity, podAntiAffinity and topologySpreadConstraints will be ignored
  affinity: { }
  topologySpreadConstraints: [ ]
  tolerations:
    - operator: Exists
      effect: NoSchedule
  priorityClassName: "system-node-critical"
  crusoeCsiDriver:
    image:
      repository: ghcr.io/crusoecloud/crusoe-csi-driver
      tag: "v0.1.9"
      imagePullSecrets: [ ]
      imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 200Mi
      limits:
        cpu: 100m
        memory: 200Mi
  driverRegistrar:
    image:
      repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
      tag: "v2.12.0"
