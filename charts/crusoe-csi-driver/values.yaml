# Default values for crusoe-csi-driver.

global:
  # Override the image registry for all images.
  # When set, this value takes precedence over the per-image registry field, redirecting
  # all images to a single private registry (e.g., "myregistry.internal").
  # Individual image registries and repositories can still be overridden per-container.
  imageRegistry: ""

csi:
  ssd:
    enabled: true
    driverName: "ssd.csi.crusoe.ai"
  fs:
    enabled: true
    driverName: "fs.csi.crusoe.ai"

# StorageClasses for each driver. Both are OFF by default so that installing or
# upgrading this chart never creates a StorageClass you did not ask for, and never
# changes which class a PVC without a storageClassName binds against. Clusters that
# manage their own StorageClasses are therefore unaffected by an upgrade.
#
# A StorageClass is rendered only when both csi.<type>.enabled and
# storageClasses.<type>.enabled are true. Enabling a class whose driver is disabled
# would leave a provisioner with nothing behind it, which binds nothing.
#
# Set isDefault on at most one class. Kubernetes tolerates more than one default but
# the resolution between them is not something to rely on.
#
# Most fields on a StorageClass are immutable once created. To change reclaimPolicy,
# volumeBindingMode, or parameters afterwards, delete the class and let the next
# upgrade recreate it. Existing PersistentVolumes keep the settings they were created
# with.
storageClasses:
  ssd:
    enabled: false
    isDefault: false
    name: crusoe-ssd
    reclaimPolicy: Delete
    volumeBindingMode: WaitForFirstConsumer
    allowVolumeExpansion: true
    # No StorageClass parameters are supported yet. CreateVolume does not read them
    # and the block size is fixed by the driver. Present for forward compatibility.
    parameters: {}
    # Mount options passed through to `mount(8)` on top of any options the driver
    # itself adds. See the fs equivalent below for caveats that also apply here.
    mountOptions: []
  fs:
    enabled: false
    isDefault: false
    name: crusoe-fs
    reclaimPolicy: Delete
    volumeBindingMode: WaitForFirstConsumer
    allowVolumeExpansion: true
    parameters: {}
    mountOptions: []

crusoe:
  # If not running on a Crusoe Managed Kubernetes cluster, projectID should be set to the Crusoe Cloud project ID
  # for your cluster.
  projectID: ""
  secrets:
    crusoeApiKeys:
      # The Crusoe CSI Driver requires access to the Crusoe API in order to manage and mount Crusoe Storage Disks.
      # It is expected that the secret will contain two keys at accessKeyPath and secretKeyPath containing
      # the base64 encoded access key and secret key respectively.
      secretName: "crusoe-secrets"
      accessKeyPath: "CRUSOE_ACCESS_KEY"
      secretKeyPath: "CRUSOE_SECRET_KEY"
  api:
    # Specify the Crusoe API endpoint to use directly.
    #endpoint: "https://api.crusoecloud.com/v1alpha5"
    # Alternatively, the driver can read the endpoint from a secret
    #fromSecret:
    #  name: "crusoe-api-keys"
    #  endpointKeyPath: "CRUSOE_API_ENDPOINT"
  nfs:
    # Specify the NFS remote ports and IP.
    remotePorts: "100.64.0.2-100.64.0.17"
    ip: "100.64.0.2"
  proxy:
    # Enable proxy support for private clusters without direct internet access.
    # When enabled, HTTP_PROXY, HTTPS_PROXY, and NO_PROXY are set on the CSI driver container.
    enabled: false
    scheme: ""
    host: ""
    port: ""
    noProxy:
      # CIDR range used by Cilium for pods.
      # If left empty, auto-discovered from the cilium-config ConfigMap in kube-system.
      podCIDR: ""
      # Additional CIDR to append to NO_PROXY. The driver itself makes no direct HTTP calls
      # to VPC addresses, but this field is provided as an escape hatch for custom environments.
      # Leave empty unless you have a specific reason to add a CIDR here.
      vpcCIDR: ""

controller:
  # Extra configuration to add under the deployment spec
  customSpec: { }
  nodeSelector: { }
  affinity: { }
  topologySpreadConstraints: [ ]
  tolerations: [ ]
  priorityClassName: "system-cluster-critical"
  crusoeCsiDriver:
    image:
      registry: ghcr.io/crusoecloud
      repository: crusoe-csi-driver
      tag: "v0.4.13"
      imagePullSecrets: [ ]
      imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 200Mi
      limits:
        cpu: 100m
        memory: 200Mi
  attacher:
    image:
      registry: registry.k8s.io
      repository: sig-storage/csi-attacher
      tag: "v4.8.1"
  provisioner:
    image:
      registry: registry.k8s.io
      repository: sig-storage/csi-provisioner
      tag: "v5.2.0"
  resizer:
    image:
      registry: registry.k8s.io
      repository: sig-storage/csi-resizer
      tag: "v1.13.2"
  livenessProbe:
    image:
      registry: registry.k8s.io
      repository: sig-storage/livenessprobe
      tag: "v2.15.0"

node:
  # Extra configuration to add under the daemonset spec
  customSpec: { }
  nodeSelector: { }
  # Note that the node agent uses a DaemonSet
  # Only NodeAffinity affinities will affect the scheduling of the node agent
  # podAffinity, podAntiAffinity and topologySpreadConstraints will be ignored
  affinity: { }
  topologySpreadConstraints: [ ]
  tolerations:
    - operator: Exists
      effect: NoSchedule
  priorityClassName: "system-node-critical"
  # DNS for the fs node DaemonSet. When useNodeResolver is true, the pod uses the
  # node's resolver (dnsPolicy: Default) instead of the in-cluster DNS service.
  # The fs node driver resolves only external names (the storage endpoint and the
  # API endpoint), so it does not need in-cluster DNS; using the node resolver
  # keeps NFS name resolution on the node's own DNS path.
  fs:
    dns:
      useNodeResolver: true
  crusoeCsiDriver:
    image:
      registry: ghcr.io/crusoecloud
      repository: crusoe-csi-driver
      tag: "v0.4.13"
      imagePullSecrets: [ ]
      imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 200Mi
      limits:
        cpu: 100m
        memory: 200Mi
  installNfsPrerequisites:
    image:
      registry: ghcr.io/crusoecloud/cmk
      repository: busybox
      tag: "1.37.0-glibc"
    resources:
      requests:
        cpu: 1
        memory: 4096Mi
      limits:
        cpu: 1
  driverRegistrar:
    image:
      registry: registry.k8s.io
      repository: sig-storage/csi-node-driver-registrar
      tag: "v2.13.0"
  livenessProbe:
    image:
      registry: registry.k8s.io
      repository: sig-storage/livenessprobe
      tag: "v2.15.0"
