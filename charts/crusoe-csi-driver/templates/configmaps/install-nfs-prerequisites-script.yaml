{{ range $csiType, $csi := .Values.csi }}
{{ if and $csi.enabled (eq $csiType "fs") }}
{{- /* Defaults live here as well as in values.yaml, because an upgrade with
       --reuse-values does not pick up new chart defaults. */}}
{{- $lock := $csi.nfsLockServices | default dict }}
{{- $statdPort := $lock.statdPort | default 662 | int }}
{{- if or (lt $statdPort 1) (gt $statdPort 29999) (eq $statdPort 111) }}
{{- fail (printf "csi.fs.nfsLockServices.statdPort must be between 1 and 29999 and not 111, got %d" $statdPort) }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "crusoe-csi-driver.fullname" $ }}-{{ $csiType }}-install-nfs-prerequisites-script
  labels:
    app: {{ include "crusoe-csi-driver.fullname" $ }}-{{ $csiType }}
data:
  install.py: |
    """
    1) find and install VAST NFS drivers for the specific kernel version. update GCC if needed.
    2) activate VAST NFS drivers
    3) update read-ahead cache automatically to 16MB
    4) apply network configuration optimizations
    """
    import subprocess
    import os
    import argparse
    import shlex
    import sys
    import time

    from datetime import datetime, timezone
    from pathlib import Path

    CSI_TYPE = "{{ $csiType }}"
    DONE_FILE = Path(f"/opt/crusoe-csi-driver/{CSI_TYPE}/nfs-prerequisites-installed")
    NFS_LOCK_SERVICES = {{ ternary "True" "False" (ne $lock.enabled false) }}
    STATD_PORT = {{ $statdPort }}
    STATD_DROPIN = Path("/etc/systemd/system/rpc-statd.service.d/50-crusoe-csi.conf")
    STATD_CONF = Path("/etc/nfs.conf.d/50-crusoe-csi.conf")
    # Where `systemctl add-wants multi-user.target rpc-statd.service` puts its link.
    STATD_WANTS = Path("/etc/systemd/system/multi-user.target.wants/rpc-statd.service")

    def run_command(command, timeout=60):
        try:
            result = subprocess.run(command, stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, check=True, shell=True, timeout=timeout)
            # return error only if error code is non-zero
            return result.stdout.strip(), result.stderr.strip() if result.returncode != 0 else None
        except subprocess.TimeoutExpired as e:
            return None, e
        except subprocess.CalledProcessError as e:
            return None, e
        except Exception as e:
            return None, e.stderr
    def manually_install_VAST_NFS_driver(auto_confirm = False):
        kernel_version, err = run_command("uname -r")
        if err:
            print(f"ERROR: could not find kernel version: {err}")
            return err

        if not auto_confirm:
            key_press = input(f"IMPORTANT: The NFS driver will now attempt to be installed manually. \n\tThis requires installing a few packages (dpkg-dev debhelper autotools-dev nfs-common).\n\tContinue? (y/N) ")
            if key_press.lower() != "y":
                print("User did not specify (y), so the operation was canceled")
                return ""

        print("Downloading and extracting the NFS driver...")
        nfs_tar_file, err = run_command("cd /tmp && curl -sSf https://vast-nfs.s3.amazonaws.com/download.sh | bash -s -- --version 4.0.35 | grep vastnfs | awk '{$1=\"\"; sub(/^ /, \"\", $0); print $1}'", 60)
        if err:
            print(f"ERROR: something went wrong when downloading the driver: {err}")
            return err
        nfs_folder = nfs_tar_file.split(".tar.xz")[0]

        out, err = run_command(f"cd /tmp && tar xf {nfs_tar_file}")
        if err:
            print(f"ERROR: something went wrong when extracting the driver: {err}")
            return err

        print("Installing dependencies...")
        out, err = run_command("DEBIAN_FRONTEND=noninteractive sudo apt-get update && sudo apt-get -y install dpkg-dev debhelper autotools-dev nfs-common", 300)
        if err:
            print(f"ERROR: something went wrong when installing dependencies: {err}")
            return err

        out, err = run_command("gcc --version | head -n 1 | awk '{print $NF}'")
        try:
            if err or int(out.split(".")[0]) < 12:
                print(f"Updating gcc compiler to 12 (current version is {out})...")
                out, err = run_command("DEBIAN_FRONTEND=noninteractive sudo apt-get -y install gcc-12 && sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 120 && sudo update-alternatives --set gcc /usr/bin/gcc-12", 300)
                if err:
                    print(f"ERROR: something went wrong when updating the gcc compiler: {err}")
                    return err
        except ValueError:
            print(f"ERROR: something went wrong when installing gcc: {err}")
            return err

        print("Building the package, this might take a while...")
        out, err = run_command(f"cd /tmp/{nfs_folder} && ./build-deb.sh", 3000)
        if err:
            # currently, there are known errors when building the package, so
            # will check for an issue with the file before failing. if the
            # package exists and is a non-zero filesize, we will assume it has
            # been built.
            found_package = False
            dir_path = f"/tmp/{nfs_folder}/deb-dist"
            if os.path.isdir(dir_path):
                for filename in os.listdir(dir_path):
                    filepath = os.path.join(dir_path, filename)
                    if os.path.isfile(filepath) \
                            and filename.startswith("vastnfs-modules_") \
                            and filename.endswith(".deb") and os.path.getsize(filepath) > 0:
                        found_package = True
                        break
            if not found_package:
                print(f"ERROR: something went wrong when building the package: {err}")
                return err

        print("Installing the NFS driver...")
        out, err = run_command(f"DEBIAN_FRONTEND=noninteractive sudo apt-get -y install /tmp/{nfs_folder}/deb-dist/vastnfs*.deb", 3000)
        if err:
            print(f"ERROR: something went wrong when manually installing the driver: {err}")
            return err

        print("The NFS driver has been installed!")
    def verify_nfs_driver():
        """Verify VAST NFS driver is functional by checking vastnfs-ctl"""
        out, err = run_command("vastnfs-ctl status")
        if err or "version:" not in out:
            print(f"WARNING: vastnfs-ctl status check failed: {err}")
            return False, "VAST NFS driver not functional"

        print(f"VAST NFS driver status verified: {out.splitlines()[0]}")
        return True, None
    def write_root_file(path, content):
        """Write a file under /etc through sudo, like the rest of the script."""
        _, err = run_command(f"sudo mkdir -p {shlex.quote(str(path.parent))} && "
                             f"printf %s {shlex.quote(content)} | sudo tee {shlex.quote(str(path))} >/dev/null")
        return err
    def ensure_nfs_lock_services():
        """
        Start rpcbind and rpc-statd on the host and keep statd running.

        NFSv3 locks go through the kernel's lockd, which asks the local rpc.statd
        to monitor the server before it sends a lock and fails the lock with
        ENOLCK if statd does not answer. On Ubuntu, rpc-statd.service is static
        and mount.nfs normally starts it on demand. The node plugin mounts from
        its own image, which has no mount.nfs, so nothing starts statd unless we
        do it here.
        """
        if not NFS_LOCK_SERVICES:
            # Undo our setup so statd stops restarting into a pinned port, but
            # leave a running statd alone: stopping it would break locks that
            # are in use.
            print("csi.fs.nfsLockServices.enabled is false, skipping rpc-statd setup.")
            # systemd has add-wants but no remove-wants, so remove the link
            # directly.
            removed = False
            for path in (STATD_DROPIN, STATD_CONF, STATD_WANTS):
                if path.is_symlink() or path.exists():
                    run_command(f"sudo rm -f {shlex.quote(str(path))}")
                    removed = True
            if removed:
                run_command("sudo systemctl daemon-reload")
            return True, None

        _, err = run_command("systemctl is-active --quiet rpcbind")
        if err:
            print("Starting rpcbind service...")
            run_command("sudo systemctl start rpcbind")
            run_command("sudo systemctl enable rpcbind")

        # nfs-common ships rpc-statd.service, and the CMK worker images
        # (Ubuntu 22.04 and 24.04) include it. Fail rather than install it:
        # many customers block internet access from their workers, and a
        # crash-looping pod with this message gets on-call to fix the image.
        _, err = run_command("systemctl cat rpc-statd.service >/dev/null 2>&1")
        if err:
            return False, "rpc-statd.service not found: the node image needs the nfs-common package"

        # Restart statd if it dies. RestartSec keeps a crash loop under systemd's
        # default start limit (5 starts in 10s). Our own file name, so an
        # override.conf written by the user is left alone.
        dropin = STATD_DROPIN
        content = "[Service]\nRestart=on-failure\nRestartSec=5s\n"
        if not dropin.exists() or dropin.read_text() != content:
            err = write_root_file(dropin, content)
            if err:
                return False, f"could not write {dropin}: {err}"
            run_command("sudo systemctl daemon-reload")

        # rpc-statd.service has no [Install] section, so enable does not work.
        # add-wants starts it at boot without one.
        _, err = run_command("sudo systemctl add-wants multi-user.target rpc-statd.service")
        if err:
            return False, f"could not enable rpc-statd at boot: {err}"

        # Pin statd's port. statd listens on every address, and without this it
        # picks a random port on each start, which no firewall rule can cover.
        # The default, 662, sits below the kernel NFS client's reserved source ports
        # (665-1023), the Kubernetes NodePort range (30000-32767) and the
        # kernel's ephemeral range (32768-60999). statd keeps its capabilities
        # when it drops root, so it can bind 662. Reboot notices go out from
        # sm-notify on a random reserved port, which a firewall does not need to
        # match. Files in /etc/nfs.conf.d override /etc/nfs.conf, which we leave
        # alone.
        statd_port = STATD_PORT
        conf = STATD_CONF
        conf_content = f"[statd]\nport = {statd_port}\n"
        conf_changed = not conf.exists() or conf.read_text() != conf_content
        if conf_changed:
            err = write_root_file(conf, conf_content)
            if err:
                return False, f"could not write {conf}: {err}"

        # lockd finds statd through rpcbind, so check the registration, not the unit.
        def statd_registered():
            out, err = run_command("rpcinfo -p 127.0.0.1")
            return not err and any(l.split()[0] == "100024" and l.split()[3] == str(statd_port)
                                   for l in out.splitlines() if len(l.split()) >= 4)

        # A running statd keeps its old port until it restarts, and one that
        # started while 662 was taken stays up unregistered, so restart in both
        # cases. A restart does not drop locks the node holds.
        if not conf_changed and statd_registered():
            print(f"rpc-statd is running and registered with rpcbind on port {statd_port}.")
            return True, None
        def port_holders():
            out, _ = run_command(f"sudo ss -Hlntup 'sport = :{statd_port}'")
            return "; ".join(" ".join(l.split()) for l in out.splitlines()) if out else "nothing"

        _, err = run_command("sudo systemctl restart rpc-statd")
        if err:
            return False, f"could not restart rpc-statd ({err}) Listening on port {statd_port}: {port_holders()}"
        for _ in range(10):
            if statd_registered():
                print(f"rpc-statd is running and registered with rpcbind on port {statd_port}.")
                return True, None
            time.sleep(1)
        return False, (f"rpc-statd did not register with rpcbind on port {statd_port}. "
                       f"Listening on port {statd_port}: {port_holders()}")
    def check_if_VAST_NFS_driver_installed():
        # vastnfs-ctl status reports the running version and loaded modules for
        # an installed driver, regardless of how it was installed or what its
        # module file is named. Skip installation when it reports a working
        # driver.
        is_functional, err = verify_nfs_driver()
        if is_functional:
            print("Functional VAST NFS driver detected, skipping installation.")
            return True, None

        return False, err
    def install_VAST_NFS_driver(auto_confirm = False):
        installed, err = check_if_VAST_NFS_driver_installed()
        if installed:
            print("The NFS driver has already been installed.")
            return True

        """
        Find kernel version
        Find VAST NFS driver version compatibility
        Install driver
        Reload the driver
        Success
        """
        kernel_version, err = run_command("uname -r")
        if err:
            print(f"ERROR: could not find kernel version: {err}")

        if kernel_version:
            err = manually_install_VAST_NFS_driver(auto_confirm)
            if err:
                print("Something went wrong when manually installing the NFS driver.")
                return

        out, err = run_command("sudo update-initramfs -u -k `uname -r` && sudo vastnfs-ctl reload", 300)
        if err:
            print(f"ERROR: could not reload NFS drivers, please report this to the Crusoe team: {err}")

        print("the NFS drivers have been installed!")
        return True
    def update_read_ahead_cache(auto_confirm = False):
        """
        check all existing NFS mounts, and update the read-ahead cache
        add the udev rule for read-ahead cache
        """
        out, err = run_command("ls /etc/udev/rules.d/95-nfs-readahead.rules")
        if out and "/etc/udev/rules.d/95-nfs-readahead.rules" in out:
            print("udev rule to apply read-ahead cache already exists, skipping")
            return

        if not auto_confirm:
            key_press = input(f"This script will now fix the read-ahead cache for NFS mounts,\n\twhich applies the recommended settings to improve sequential read performance.\n\tContinue? (y/N) ")
            if key_press.lower() != "y":
                print("User did not specify (y), so the operation was canceled")
                return

        out, err = run_command(r"""echo 'SUBSYSTEM=="bdi", ACTION=="add", PROGRAM="/bin/awk -v bdi=$kernel '\''BEGIN{ret=1} {if ($$4 == bdi) {ret=0}} END{exit ret}'\'' /proc/fs/nfsfs/volumes", ATTR{read_ahead_kb}="16384"' | sudo sh -c 'cat > /etc/udev/rules.d/95-nfs-readahead.rules'""")
        if err:
            print(f"ERROR: failure creating udev rule: {err}")
            return

        out, err = run_command("sudo udevadm control --reload-rules && sudo udevadm trigger --verbose --action add --subsystem-match nvme && sudo udevadm trigger --verbose --action add")
        if err:
            print(f"ERROR: could not reload udev rules: {err}")
            return

        out, _ = run_command("grep -qx '\\[nfsrahead\\]' /etc/nfs.conf && echo present")
        if out == "present":
            print("[nfsrahead] already in /etc/nfs.conf, skipping")
            print("Updated readahead cache settings successfully.")
            return
        out, err = run_command("""echo '[nfsrahead]
            nfs=16384
            nfs4=16384
            default=128' | sudo sh -c 'cat >> /etc/nfs.conf'""")
        if err:
            print(f"ERROR: could not reload udev rules: {err}")
            return

        print("Updated readahead cache settings successfully.")
    def optimize_network_interface(auto_confirm = False):
        """
        optimizes the VM's network interface settings
        for high shared disk performance.
        """
        if not auto_confirm:
            key_press = input(f"This script will now optimize the VM's network interface,\n\twhich applies the recommended settings to improve shared disk network performance.\n\tThis will be applied via creating a systemd service under /etc/systemd/system/network-config-nfs.service.\n\tContinue? (y/N) ")
            if key_press.lower() != "y":
                print("User did not specify (y), so the operation was canceled")
                return

        out, err = run_command(
            r"""
            sudo sh -c "echo \"#!/bin/bash\" > /usr/local/bin/network-config-nfs.sh"
            """
        )
        if err:
            print(f"ERROR: could not apply MTU for network-config-nfs.sh: {err}")
            return

        out, err = run_command(
            r"""
            sudo sh -c "echo \"ip -o link show | awk -F': ' '/ens/{print $\"2\"}' | xargs -r -I{} sudo ip link set dev {} mtu 9000\" >> /usr/local/bin/network-config-nfs.sh"
            """
        )
        if err:
            print(f"ERROR: could not apply MTU for network-config-nfs.sh: {err}")
            return

        out, err = run_command(
            r"""
            sudo sh -c "echo \"ip -o link show | awk -F': ' '/ens/{print $\"2\"}' | xargs -r -I{} bash -c 'sudo ethtool -G {} tx 8192 && sudo ethtool -G {} rx 8192'\" >> /usr/local/bin/network-config-nfs.sh"
            """
        )
        if err:
            print(f"ERROR: could not apply ring buffer for network-config-nfs.sh: {err}")
            return

        out, err = run_command("sudo chmod +x /usr/local/bin/network-config-nfs.sh")
        if err:
            print(f"ERROR: could not apply chmod for network-config-nfs.sh: {err}")
            return

        out, err = run_command(
            r"""
            sudo sh -c 'echo "[Unit]\nDescription=Network Configuration for NFS\nAfter=network-online.target\n\n[Service]\nType=oneshot\nExecStart=/usr/local/bin/network-config-nfs.sh\n\n[Install]\nWantedBy=multi-user.target" > /etc/systemd/system/network-config-nfs.service'
            """
        )
        if err:
            print(f"ERROR: could not apply systemd for network-config-nfs.sh: {err}")
            return

        out, err = run_command("sudo systemctl daemon-reload && sudo systemctl enable network-config-nfs.service && sudo systemctl start network-config-nfs.service")
        if err:
            print(f"ERROR: could not apply systemd for network-config-nfs.sh: {err}")
            return

        print("Optimized network interface settings successfully.")
    def check_args_y():
        parser = argparse.ArgumentParser(description="A script that checks for a -y flag.")
        parser.add_argument('-y', action='store_true', help="A flag to confirm an action.")

        args = parser.parse_args()

        return args.y
    def do_main():
        auto_confirm = check_args_y()

        # If DONE_FILE exists, validate health
        if DONE_FILE.exists():
            print("Previous installation detected, performing health check...")
            is_functional, err = verify_nfs_driver()

            if is_functional:
                print("NFS driver is healthy, skipping installation.")
                ok, err = ensure_nfs_lock_services()
                if not ok:
                    print(f"ERROR: {err}")
                    sys.exit(1)
                return
            else:
                print(f"Health check failed: {err}")
                print("NFS driver validation failed, triggering reinstallation...")
                try:
                    DONE_FILE.unlink()  # Delete the marker
                except Exception as e:
                    print(f"Warning: Could not delete DONE_FILE: {e}")
                # Fall through to reinstallation

        # Install or reinstall NFS driver
        print("Installing/reinstalling NFS driver...")
        success = install_VAST_NFS_driver(auto_confirm)

        if success:
            update_read_ahead_cache(auto_confirm)
            optimize_network_interface(auto_confirm)

            # Final validation before marking as done
            print("Performing final validation...")
            is_functional, err = verify_nfs_driver()

            if is_functional:
                # Only write DONE_FILE if verification passed
                DONE_FILE.parent.mkdir(parents=True, exist_ok=True)
                timestamp = datetime.now(timezone.utc).isoformat()
                msg = f"NFS prerequisites installed and validated at {timestamp}"
                DONE_FILE.write_text(msg + "\n")
                print(msg)
                # statd runs after the marker, so a statd failure fails the pod
                # and the retry takes the health-check path, which redoes only
                # the statd setup.
                ok, err = ensure_nfs_lock_services()
                if not ok:
                    print(f"ERROR: {err}")
                    sys.exit(1)
            else:
                print(f"ERROR: Installation completed but validation failed: {err}")
                print("Installation will be retried on next pod restart.")
                sys.exit(1)
        else:
            print("ERROR: Installation failed")
            sys.exit(1)
    if __name__ == "__main__":
        do_main()

{{- end }}
{{- end }}