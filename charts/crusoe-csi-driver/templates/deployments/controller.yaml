{{ range $csiType, $csi := .Values.csi }}
{{ if $csi.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "crusoe-csi-driver.fullname" $ }}-{{ $csiType }}-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "crusoe-csi-driver.fullname" $ }}-{{ $csiType }}
  template:
    metadata:
      labels:
        app: {{ include "crusoe-csi-driver.fullname" $ }}-{{ $csiType }}
    spec:
      serviceAccountName: {{ include "crusoe-csi-driver.fullname" $ }}-controller
      {{- with $.Values.controller.crusoeCsiDriver.image.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.controller.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.controller.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with $.Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: crusoe-csi-driver
          image: "{{ $.Values.controller.crusoeCsiDriver.image.repository }}:{{ $.Values.controller.crusoeCsiDriver.image.tag }}"
          imagePullPolicy: {{ $.Values.controller.crusoeCsiDriver.image.imagePullPolicy }}
          args:
            - "--crusoe-csi-driver-type={{ $csiType }}"
            - "--services=controller,identity"
            - "--socket-address=unix:/csi/{{ $csiType }}-controller.sock"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- with $.Values.crusoe.api }}
            {{- with .endpoint }}
            - name: CRUSOE_API_ENDPOINT
              value: {{ quote . }}
            {{- else }}
            {{- if .fromSecret}}
            - name: CRUSOE_API_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ .fromSecret.name }}
                  key: {{ .fromSecret.endpointKeyPath }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with $.Values.crusoe.projectID }}
            - name: CRUSOE_PROJECT_ID
              value: {{ . }}
            {{- end }}
            - name: CRUSOE_CSI_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{$.Values.crusoe.secrets.crusoeApiKeys.secretName}}
                  key: {{$.Values.crusoe.secrets.crusoeApiKeys.accessKeyPath}}
            - name: CRUSOE_CSI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{$.Values.crusoe.secrets.crusoeApiKeys.secretName}}
                  key: {{$.Values.crusoe.secrets.crusoeApiKeys.secretKeyPath}}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: mountpoint-dir
              mountPath: /var/lib/kubelet
              mountPropagation: "Bidirectional"
          securityContext:
            privileged: true
          {{- with $.Values.controller.crusoeCsiDriver.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: csi-attacher
          image: "{{ $.Values.controller.attacher.image.repository }}:{{ $.Values.controller.attacher.image.tag }}"
          args:
            - "--v=5"
            - "--csi-address=/csi/{{ $csiType }}-controller.sock"
            - "--http-endpoint=0.0.0.0:8081"
            - "--metrics-path=/metrics"
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: csi-provisioner
          image: "{{ $.Values.controller.provisioner.image.repository }}:{{ $.Values.controller.provisioner.image.tag }}"
          args:
            - "--v=5"
            - "--csi-address=/csi/{{ $csiType }}-controller.sock"
            - "--feature-gates=Topology=true"
            - "--extra-create-metadata"
            - "--default-fstype=ext4"
            - "--controller-publish-readonly=true"
            - "--http-endpoint=0.0.0.0:8082"
            - "--metrics-path=/metrics"
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: csi-resizer
          image: "{{ $.Values.controller.resizer.image.repository }}:{{ $.Values.controller.resizer.image.tag }}"
          args:
            - "--v=5"
            - "--csi-address=/csi/{{ $csiType }}-controller.sock"
            - "--handle-volume-inuse-error=true"
            - "--http-endpoint=0.0.0.0:8083"
            - "--metrics-path=/metrics"
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
      volumes:
        # This volume is where the socket for kubelet->driver communication is done
        - name: socket-dir
          hostPath:
            path: /var/lib/kubelet/plugins/{{ include "crusoe-csi-driver.fullname" $ }}
            type: DirectoryOrCreate
          # This volume is where the driver mounts volumes
        - name: mountpoint-dir
          hostPath:
            path: /var/lib/kubelet
            type: Directory
      {{- with $.Values.controller.customSpec }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
{{ end }}
{{ end }}