---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Release.Name }}-node-read-labels
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-node-sa
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Release.Name }}-node-read-labels
  apiGroup: rbac.authorization.k8s.io
