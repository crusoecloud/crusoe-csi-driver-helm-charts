---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "crusoe-csi-driver.fullname" . }}-node-read-labels
subjects:
  - kind: ServiceAccount
    name: {{ include "crusoe-csi-driver.fullname" . }}-node
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "crusoe-csi-driver.fullname" . }}-node-read-labels
  apiGroup: rbac.authorization.k8s.io
