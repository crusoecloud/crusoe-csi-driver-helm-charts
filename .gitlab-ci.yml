default:
  tags:
    - x86-crusoecloud_build_prod-docker-build
include:
  - project: 'crusoeenergy/tools'
    file: '/templates/go.gitlab-ci.yml'

variables:
  CI_IMAGE: registry.gitlab.com/crusoeenergy/tools/go-ci-1.21

test_and_lint:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "release"'
      changes: !reference [.code-changes, changes]
    - if: '$CI_MERGE_REQUEST_ID'
      changes: !reference [.code-changes, changes]
    # don't run CI for semver tags, do run it for custom tags
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG !~ /^(.+\/)?v[0-9]+\.[0-9]+\.[0-9]+$/'

# Remove the tag_semver and pages jobs from merges into main.
# The tag_semver job will be run using a GitHub action on
# merges into the release branch, and we will only ever
# want to tag them using that job.
tag_semver:
  rules:
    - when: never

pages:
  rules:
    - when: never

code_intelligence:
  rules:
    - when: never
# Chart rendering assertions. The chart-testing job in .github/workflows/lint.yaml
# runs `on: pull_request` and so never fires for a GitLab MR, which left chart
# changes with no automated validation. This covers the cheap half: helm lint plus
# a set of render assertions. See hack/test-storageclass-render.sh.
test_charts:
  image:
    name: alpine/helm:3.14.4
    entrypoint: [""]
  needs: []
  script:
    - apk add --no-cache bash
    - helm lint charts/crusoe-csi-driver
    - bash hack/test-storageclass-render.sh
  rules:
    - if: '$CI_MERGE_REQUEST_ID'
      changes: &chart-changes
        - charts/**/*
        - hack/*.sh
    - if: '$CI_COMMIT_BRANCH == "release" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *chart-changes

# Upgrade assertions. These need a cluster, because they install a published chart
# version and then upgrade to this one; the render assertions above cannot see
# anything that only happens when a release already exists. Nothing waits for pods
# to be ready, so a throwaway kind cluster is enough.
#
# This job gates. The assertions pass locally against kind, but the kind-in-dind
# setup below has only been exercised here, so if the job is red start with the
# cluster wiring rather than the assertions: the API server runs inside the dind
# daemon, and reaching it from this container is the fragile part. To reproduce
# outside CI, `kind create cluster` and then `make test-upgrade`.
test_charts_upgrade:
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  needs: []
  before_script:
    - apk add --no-cache bash curl
    # The dind service starts alongside this container, so it is usually not
    # accepting connections yet. Without this wait, `kind create cluster` fails
    # immediately with "cannot connect to the Docker daemon".
    - |
      for _ in $(seq 1 30); do
        docker info >/dev/null 2>&1 && break
        sleep 2
      done
      docker info >/dev/null
    - curl -sSLo /usr/local/bin/kind https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
    - curl -sSLo /usr/local/bin/kubectl "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl"
    - curl -sSL https://get.helm.sh/helm-v3.16.2-linux-amd64.tar.gz | tar xz -C /tmp
    - install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
    - chmod +x /usr/local/bin/kind /usr/local/bin/kubectl
    # The API server runs inside the dind daemon, not this container, so bind it to
    # a fixed port and reach it over the `docker` service hostname. TLS verification
    # is skipped because the cert has no SAN for that hostname; this is a throwaway
    # cluster with no real data in it.
    - |
      cat > /tmp/kind.yaml <<'KIND'
      kind: Cluster
      apiVersion: kind.x-k8s.io/v1alpha4
      networking:
        apiServerAddress: "0.0.0.0"
        apiServerPort: 6443
      KIND
    - kind create cluster --name ci --config /tmp/kind.yaml
    - kubectl config set-cluster kind-ci --server=https://docker:6443 --insecure-skip-tls-verify=true
    - kubectl cluster-info
  script:
    - bash hack/test-upgrade.sh
  after_script:
    - kind delete cluster --name ci || true
  rules:
    - if: '$CI_MERGE_REQUEST_ID'
      changes: *chart-changes
    - if: '$CI_COMMIT_BRANCH == "release" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *chart-changes
